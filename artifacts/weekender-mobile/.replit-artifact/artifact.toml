kind = "mobile"
previewPath = "/weekender-mobile/"
title = "The Weekender Mobile"
description = "The native mobile companion for The Weekender, helping bar patrons discover nearby venues, tally drinks anonymously, spin up a night out, and build a complete date-night itinerary using native location services."
version = "1.0.0"
id = "artifacts/weekender-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/weekender-mobile/" ]
localPort = 20045

[services.development]
run = "pnpm --filter @workspace/weekender-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weekender-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/weekender-mobile", "run", "serve" ]

[services.env]
PORT = "20045"
BASE_PATH = "/weekender-mobile/"
